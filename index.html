<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./src/vendor/skeleton.css/normalize.css">
  <link rel="stylesheet" href="./src/vendor/skeleton.css/skeleton.css">

  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./src/assets/logo.png">

  <script type="module" src="./src/vendor/video.js/video.min.js"></script>
  <script type="module" src="./src/scripts/main.js"></script>

  <title>Plus+ Sandbox</title>
</head>

<body>
  <main class="container">
    <h1 class="title centered">Plus+ Sandbox</h1>

    <div class="content">
      <div class="input">
        <input id="url-input" class="u-full-width" type="url" autocomplete="off" role="combobox"
          aria-controls="channels" placeholder="Paste a stream URL or pick a channel...">
        <ul id="channels" role="listbox" hidden></ul>
        <p id="status" class="status" role="status" hidden></p>
      </div>

      <video-player poster="./src/assets/logo.png">
        <video-skin class="player">
          <hlsjs-video id="player" preload="auto" autoplay playsinline></hlsjs-video>
        </video-skin>
      </video-player>

      <noscript>To view this video please enable JavaScript.</noscript>
    </div>
  </main>
</body>

</html>
